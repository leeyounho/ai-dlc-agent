[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dlc-agent"
version = "0.1.0"
description = "Internal AI-DLC agent: approvals, durable execution, model routing, and offline evaluation"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
ai-dlc = "ai_dlc.cli:main"

[tool.setuptools.packages.find]
include = ["ai_dlc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
